.t{flex:1}
.n{color:var(--muted);font-size:.9rem;font-weight:400}
.list{display:none;margin:0 0 8px 42px;padding:0;list-style:none;border-left:1px solid var(--line)}

.empty{color:var(--muted);padding:24px 0;text-align:center}

const out=document.getElementById('out'),q=document.getElementById('q'),sw=document.getElementById('sw'),lbl=document.getElementById('lbl');
let newWin=true;
try{const s=localStorage.getItem('linkTarget');if(s==='same')newWin=false}catch(e){}
const open=new Set();
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function applyTarget(){
  sw.setAttribute('aria-checked',newWin);
  sw.setAttribute('aria-label',newWin?'Opening links in a new window':'Opening links in the current window');
  lbl.innerHTML='<b>'+(newWin?'New window':'Current window')+'</b>';
  document.querySelectorAll('.list a').forEach(a=>{a.target=newWin?'_blank':'_top';a.rel='noopener noreferrer'});
}
function render(){
  const term=q.value.trim().toLowerCase();
  let html='',shown=0;
  DATA.forEach(g=>{
    const secs=g.sections.map(s=>({t:s.t,l:term?s.l.filter(x=>x[0].toLowerCase().includes(term)||s.t.toLowerCase().includes(term)):s.l,id:s.id})).filter(s=>s.l.length);
    if(!secs.length)return;
    html+=g.name?'<h2 class="area">'+esc(g.name)+'</h2>':'';
    secs.forEach(s=>{
      shown++;
      const isOpen=term||open.has(s.id);
      html+='<section class="sec'+(isOpen?' open':'')+'" data-id="'+s.id+'"><button class="head" aria-expanded="'+!!isOpen+'"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span class="t">'+esc(s.t)+'</span><span class="n">'+s.l.length+'</span></button><ul class="list">'+s.l.map(x=>'<li><a href="'+esc(x[1])+'">'+esc(x[0])+'</a></li>').join('')+'</ul></section>';
    });
  });
  out.innerHTML=shown?html:'<p class="empty">No lessons match “'+esc(q.value)+'”. Try a shorter search.</p>';
  applyTarget();
}
out.addEventListener('click',e=>{
  const h=e.target.closest('.head');if(!h)return;
  const s=h.parentElement,id=s.dataset.id;
  const o=s.classList.toggle('open');h.setAttribute('aria-expanded',o);
  o?open.add(id):open.delete(id);
});
sw.addEventListener('click',()=>{newWin=!newWin;try{localStorage.setItem('linkTarget',newWin?'new':'same')}catch(e){}applyTarget()});
q.addEventListener('input',render);
const total=DATA.reduce((a,g)=>a+g.sections.reduce((b,s)=>b+s.l.length,0),0);
document.getElementById('meta').textContent=total+' lessons across '+DATA.reduce((a,g)=>a+g.sections.length,0)+' sections';
render();
</script>
