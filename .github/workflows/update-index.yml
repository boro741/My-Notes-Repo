name: Auto Update Index

on:
  push:
    branches:
      - master
      - main
    paths:
      - '**/*.html'
      - '!index.html'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Index Builder
        run: node scripts/build-index.js

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes in index.html to commit."
          else
            git commit -m "Auto-update index.html [skip ci]"
            git push
          fi
